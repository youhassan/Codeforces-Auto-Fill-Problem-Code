<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codeforces Auto-Fill</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Top Nav Tabs -->
    <nav class="top-nav">
      <div class="nav-tab active" data-tab="autofill">
        <svg class="nav-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72z"/>
          <path d="m14 7 3 3"/>
          <path d="M5 6v4"/>
          <path d="M19 14v4"/>
          <path d="M10 2v2"/>
          <path d="M7 8H3"/>
          <path d="M21 16h-4"/>
          <path d="M11 3H9"/>
        </svg>
        <span>Auto-Fill</span>
      </div>
      <div class="nav-tab" data-tab="manual">
        <span>Manual Entry</span>
      </div>
    </nav>

    <!-- Category / Mode Selector -->
    <div class="mode-selector">
      <button type="button" class="mode-btn active" id="mode-problemset">
        <svg class="mode-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
        </svg>
        <span class="mode-label">Problemset</span>
        <div class="active-indicator"></div>
      </button>

      <button type="button" class="mode-btn" id="mode-contest">
        <svg class="mode-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 4h-3V2H8v2H5c-1.1 0-2 .9-2 2v3c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 17.9V20H7v2h10v-2h-4v-2.1c1.84-.31 3.28-1.57 3.61-3.96C19.08 13.63 21 11.55 21 9V6c0-1.1-.9-2-2-2zm-14 5V6h3v4.61c-1.74-.32-3-1.66-3-3.61zm14 0c0 1.95-1.26 3.29-3 3.61V6h3v3z"/>
        </svg>
        <span class="mode-label">Contest</span>
      </button>

      <button type="button" class="mode-btn" id="mode-gym">
        <svg class="mode-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
        </svg>
        <span class="mode-label">Gym / Group</span>
      </button>
    </div>

    <!-- Main Content Card -->
    <div class="settings-card">
      <!-- Auto-Fill View -->
      <div id="autofill-section" class="section-content active">
        <!-- Row 1: Problem Code -->
        <div class="card-row">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
            </svg>
            <span class="row-label">Problem Code</span>
          </div>
          <div class="row-right">
            <span class="code-badge" id="problem-code">None</span>
          </div>
        </div>

        <!-- Row 2: Problem Title -->
        <div class="card-row">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span class="row-label">Problem</span>
          </div>
          <div class="row-right">
            <span class="value-text" id="problem-title">Not detected</span>
          </div>
        </div>

        <!-- Row 3: Capture Time -->
        <div class="card-row">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span class="row-label">Last Captured</span>
          </div>
          <div class="row-right">
            <span class="value-text muted" id="timestamp">—</span>
          </div>
        </div>

        <!-- Row 4: Auto-Fill Toggle -->
        <div class="card-row">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72z"/>
              <path d="m14 7 3 3"/>
              <path d="M5 6v4"/>
              <path d="M19 14v4"/>
              <path d="M10 2v2"/>
              <path d="M7 8H3"/>
              <path d="M21 16h-4"/>
              <path d="M11 3H9"/>
            </svg>
            <span class="row-label">Auto-Fill on Submit</span>
          </div>
          <div class="row-right">
            <label class="switch">
              <input type="checkbox" id="autofill-toggle" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Manual Entry View -->
      <div id="manual-section" class="section-content">
        <form id="override-form" class="manual-form">
          <div class="manual-input-wrap">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <input 
              type="text" 
              id="manual-code-input" 
              placeholder="e.g. 1800C1 or 33A" 
              maxlength="15"
              spellcheck="false"
              autocomplete="off"
            />
          </div>
          <button type="submit" class="btn-set" id="save-override-btn">Apply Code</button>
        </form>
      </div>
    </div>

    <!-- Notification Feedback -->
    <div id="feedback-msg" class="feedback-msg"></div>

    <!-- Primary Action Button (Start Recording style) -->
    <a href="https://codeforces.com/problemset/submit" target="_blank" class="btn-primary" id="open-submit-btn">
      Open Submit Page
    </a>

    <!-- Footer Controls -->
    <footer class="popup-footer">
      <button type="button" class="btn-clear" id="clear-btn">Clear Saved Problem</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
